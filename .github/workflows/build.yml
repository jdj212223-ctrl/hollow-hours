# Builds Hollow Hours for macOS (Apple Silicon), Windows and Linux (SteamOS too) on every push.
# A tag like v2.2 also attaches the three downloads to that GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch replaces the older build still running (the newest one has every change and
# releases them all), so Mac runners don't pile up and get cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The release number goes into the game itself, so official builds know when a newer release is out (auto-update).
env:
  HH_BUILD: ${{ github.run_number }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One app for Apple Silicon and Intel Macs.
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          # Snapdragon / Windows on ARM laptops, built natively.
          - os: windows-11-arm
            name: Windows-ARM64
          # An older Ubuntu, so the game also runs on older Linux and SteamOS (glibc 2.35+).
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux libraries (sound, controllers, window)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      - name: Tests that need no accounts or network
        if: runner.os != 'macOS'
        run: cargo test --release --locked -- voice_round paths_go long_bubbles sessions_carry night_mall

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          UNIVERSAL=1 sh macos/bundle.sh
          lipo -archs "Hollow Hours.app/Contents/MacOS/hollow-hours-game"
          ditto -c -k --keepParent "Hollow Hours.app" Hollow-Hours-macOS.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "Hollow Hours" | Out-Null
          Copy-Item target/release/hollow-hours.exe "Hollow Hours/Hollow Hours.exe"
          Copy-Item target/release/hh-mcp.exe "Hollow Hours/hh-mcp.exe"
          Copy-Item windows/README.txt "Hollow Hours/README.txt"
          $name = if ("${{ matrix.name }}" -eq "Windows-ARM64") { "Hollow-Hours-Windows-ARM64.zip" } else { "Hollow-Hours-Windows.zip" }
          Compress-Archive -Path "Hollow Hours" -DestinationPath $name

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p hollow-hours
          cp target/release/hollow-hours target/release/hh-mcp linux/hollow-hours.desktop linux/hollow-hours.png linux/README.txt hollow-hours/
          chmod +x hollow-hours/hollow-hours hollow-hours/hh-mcp
          tar czf Hollow-Hours-Linux-x86_64.tar.gz hollow-hours

      - uses: actions/upload-artifact@v4
        with:
          name: Hollow-Hours-${{ matrix.name }}
          path: Hollow-Hours-*.*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Hollow Hours $GITHUB_REF_NAME" --notes "Downloads for macOS, Windows and Linux (SteamOS)."
          gh release upload "$GITHUB_REF_NAME" Hollow-Hours-*.* --clobber

  # The Linux build packed as a Flatpak.
  flatpak:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hollow-Hours-Linux
      - run: tar xzf Hollow-Hours-Linux-x86_64.tar.gz
      # Built directly with the runtime already in the image (the ready-made action tried to update it and failed).
      - name: Build the Flatpak
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo build flatpak/io.github.jdj212223_ctrl.HollowHours.yml
          flatpak build-bundle repo Hollow-Hours.flatpak io.github.jdj212223_ctrl.HollowHours
          ls -la Hollow-Hours.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: Hollow-Hours-Flatpak
          path: Hollow-Hours.flatpak
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Hollow-Hours.flatpak

  # Android (.apk) with touch controls, built with today's tools (android/build-apk.sh).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the .apk
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          sh android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Hollow-Hours-Android
          path: Hollow-Hours-Android.apk
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Hollow-Hours-Android.apk

  # iPhone / iPad (.ipa). Unsigned: install it with Sideloadly or AltStore, which sign it with your own Apple ID.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target aarch64-apple-ios --bin hollow-hours
      - name: Package the .ipa
        run: |
          APP=Payload/HollowHours.app
          mkdir -p "$APP"
          cp target/aarch64-apple-ios/release/hollow-hours "$APP/HollowHours"
          cp ios/Info.plist "$APP/Info.plist"
          cp ios/AppIcon60x60@2x.png ios/AppIcon76x76@2x.png "$APP/"
          zip -qr Hollow-Hours-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Hollow-Hours-iOS
          path: Hollow-Hours-iOS.ipa
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Hollow-Hours-iOS.ipa

  # Every update that lands on main is released automatically once all builds pass: v2.4.<run>, with every
  # download attached and the changes since the last release as notes.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, flatpak, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "([0-9]+)\.([0-9]+).*/\1.\2/')
          tag="v${base}.${{ github.run_number }}"
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "**Hollow Hours ${tag#v}**: built and released automatically from the latest update."
            echo
            echo "**What's new**"
            if [ -n "$last" ]; then git log --pretty='- %s' "$last"..HEAD; else git log -20 --pretty='- %s'; fi
            echo
            echo "**Downloads:** macOS (Apple Silicon + Intel), Windows, Windows ARM64 (Snapdragon), Linux / SteamOS, Flatpak, Android (.apk), iPhone/iPad (.ipa, sideload)."
            echo "First launch: macOS right-click → Open; Windows \"More info\" → \"Run anyway\"."
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > notes.md
          ls -la dist
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Hollow Hours ${tag#v}" --notes-file notes.md --latest
