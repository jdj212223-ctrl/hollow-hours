[package]
name = "hollow-hours"
version = "0.1.0"
edition = "2021"
description = "A small horror game where the characters are real AIs, with fear / discomfort / liminality meters, phobia toggles, a panic key and optional haptic vest effects."
license = "MIT"

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 3
